name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build DuckWalk APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Unity Hub path for Buildalon
        # buildalon/unity-setup looks for the Hub at /opt/unityhub/unityhub,
        # but ubuntu-latest ships Unity Hub 3.x elsewhere (e.g. /usr/bin).
        run: |
          HUB_BIN="$(readlink -f "$(which unityhub)")"
          echo "Unity Hub binary: $HUB_BIN"
          sudo mkdir -p /opt/unityhub
          sudo ln -sf "$HUB_BIN" /opt/unityhub/unityhub

      - name: Setup Unity (2022.3.76f1 + Android modules)
        uses: buildalon/unity-setup@v2
        with:
          # Editor version is auto-detected from ProjectSettings/ProjectVersion.txt
          build-targets: Android
          cache-installation: true

      - name: Activate Unity license (Personal)
        uses: buildalon/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build APK
        uses: buildalon/unity-action@v3
        with:
          log-name: Android-Build
          build-target: Android
          args: -quit -batchmode -executeMethod BuildScript.BuildAndroid

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: duckwalk-apk
          path: Builds/Android/*.apk
          if-no-files-found: error

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: '*.log'
